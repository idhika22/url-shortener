services:
  
  mongo:
    image: mongo:7


    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    
    volumes:
      - mongodata:/data/db
    
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped
  
  app:
    build: .

    environment:
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB: "${MONGO_DB}"
    
    depends_on:
      mongo:
        condition: service_healthy
    
    restart: unless-stopped
  
  nginx:
    image: nginx:1.27-alpine

    ports:
      - "8080:80"
    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    
    depends_on:
      - app
  
volumes:
  mongodata:

