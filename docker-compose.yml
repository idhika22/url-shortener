services:
  
  mongo:
    image: mongo:7


    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    
    volumes:
      - mongodata:/data/db
    
    healthcheck:
      test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped
  
  app:
    image: ghcr.io/idhika22/url-shortener:${IMAGE_TAG:-latest}

    #build: .

    environment:
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin"
      MONGO_DB: "${MONGO_DB}"
    
    depends_on:
      mongo:
        condition: service_healthy
    
    restart: unless-stopped
  
  nginx:
    image: nginx:1.27-alpine

    ports:
      - "8080:80"
    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    
    depends_on:
      - app
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: url_shortener_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
  grafana:
    image: grafana/grafana:11.5.2
    container_name: url_shortener_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  
volumes:
  mongodata:
  prometheus_data:
  grafana_data:

  

